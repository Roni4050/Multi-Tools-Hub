<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - MultiTools Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between">
  <header class="h-16 flex items-center justify-between px-6 border-b border-slate-200 dark:border-slate-800">
    <a href="index.html" class="flex items-center gap-2 font-bold text-lg">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white">
        <i data-lucide="layers" class="w-4 h-4"></i>
      </div>
      <span>MultiTools Hub</span>
    </a>
    <button type="button" onclick="window.toggleTheme()" class="p-2 rounded-lg border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300">
      <i data-lucide="moon" class="w-4 h-4 hidden dark:block"></i>
      <i data-lucide="sun" class="w-4 h-4 block dark:hidden"></i>
    </button>
  </header>

  <main class="flex-1 flex flex-col items-center justify-center text-center p-6">
    <div class="w-20 h-20 rounded-2xl bg-indigo-50 dark:bg-indigo-950/80 text-indigo-600 dark:text-indigo-400 flex items-center justify-center mb-6">
      <i data-lucide="compass" class="w-10 h-10"></i>
    </div>
    <h1 class="text-4xl font-extrabold text-slate-900 dark:text-white">404 - Page Not Found</h1>
    <p class="mt-3 text-slate-600 dark:text-slate-400 max-w-md">
      The tool or page you requested does not exist or has been relocated. Explore all 12 of our free client-side utilities on our homepage.
    </p>
    <a href="index.html" class="mt-8 px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm transition-all shadow-md shadow-indigo-600/20 inline-flex items-center gap-2">
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
      <span>Back to All 12 Tools</span>
    </a>
  </main>

  <footer class="py-6 text-center text-xs text-slate-500 border-t border-slate-200 dark:border-slate-800">
    © 2026 MultiTools Hub. 100% Client-Side Private Utility Suite.
  </footer>
  <script src="assets/js/main.js"></script>
</body>
</html>
